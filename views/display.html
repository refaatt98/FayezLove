<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة رمز الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0}body{font-family:Cairo,sans-serif;background:#14161a;color:#fff;display:flex;flex-direction:column}
.bar{height:8px;background:linear-gradient(90deg,#C8102E 0 10%,#14161a 10% 40%,#fff 40% 60%,#0B6B3A 60%)}
main{flex:1;display:flex;align-items:center;justify-content:space-around;gap:5vw;padding:2vh 5vw;flex-wrap:wrap}
.info{display:flex;flex-direction:column;gap:2vh;max-width:46vw}.u{color:#7fd3a0;font-weight:700;font-size:clamp(18px,2.2vw,36px)}
h1{margin:0;font-size:clamp(32px,4.6vw,84px);line-height:1.2;font-weight:800}.d{font-size:clamp(20px,2.2vw,40px);color:#e3a1ab}
.m{font-size:clamp(22px,2.4vw,44px);font-weight:700}#t{font-size:clamp(48px,6vw,110px);font-weight:800}
.prog{height:12px;background:#2b2e34;max-width:600px}#p{height:12px;background:#0B6B3A;width:100%}
.q{background:#fff;padding:2vmin;box-sizing:border-box;width:min(72vh,44vw);aspect-ratio:1;flex-shrink:0}.q img{width:100%;height:100%;display:block}
#idle{font-size:clamp(28px,3vw,56px);text-align:center}[hidden]{display:none!important}
.tools{position:fixed;top:16px;left:16px;display:flex;gap:8px;opacity:.5}.tools:hover{opacity:1}
.tools a,.tools button{background:#fff;color:#14161a;border:0;border-radius:6px;padding:8px 14px;font:700 14px Cairo;text-decoration:none;cursor:pointer}
@media(max-width:800px){.info{max-width:100%}.q{width:80vw}}
</style></head><body><div class="bar"></div>
<div class="tools"><button id="fs">ملء الشاشة</button><a href="/dashboard">رجوع</a></div>
<main id="live" hidden>
<div class="info"><div class="u">جامعة النجاح الوطنية</div><h1>دراسات فلسطينية (خريف 2026)</h1><div class="d">الدكتور سائد أبو حجلة</div>
<div class="m">امسح الرمز بهاتفك لتسجيل حضورك</div>
<div class="m">الرمز صالح لمدة: <span id="t">--:--</span></div><div class="prog"><div id="p"></div></div>
<div class="m" id="c" style="color:#cfd2d8;font-size:clamp(18px,1.8vw,32px)"></div></div>
<div class="q"><img id="qr" alt="رمز QR للحضور"></div>
</main>
<main id="idle" hidden>لا توجد محاضرة مفتوحة حاليًا<br><a href="/dashboard" style="color:#7fd3a0;font-size:.6em">العودة إلى لوحة التحكم لبدء محاضرة</a></main>
<script src="/js/display.js"></script></body></html>
