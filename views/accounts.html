<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الحسابات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Cairo,sans-serif;background:#FAF8F3;color:#14161a}.bar{height:8px;background:linear-gradient(90deg,#C8102E 0 10%,#14161a 10% 40%,#fff 40% 60%,#0B6B3A 60%)}
main{max-width:720px;margin:0 auto;padding:32px 24px;display:flex;flex-direction:column;gap:18px}a{color:#0B6B3A;font-weight:700}
.card{background:#fff;border:1px solid #E3DFD6;border-top:4px solid #0B6B3A;padding:24px;display:flex;flex-direction:column;gap:14px}
form{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:220px;height:46px;padding:0 14px;border:1px solid #9a968c;border-radius:6px;font:16px Cairo}
button{padding:0 22px;min-height:46px;background:#0B6B3A;color:#fff;border:0;border-radius:6px;font:700 15px Cairo;cursor:pointer}
table{width:100%;border-collapse:collapse;text-align:right}th,td{padding:10px 6px;border-bottom:1px solid #E3DFD6}th{color:#5b5f66;font-size:14px}
.tag{font-size:13px;padding:2px 10px;border-radius:20px;white-space:nowrap}.on{background:#e7f3ec;color:#0B6B3A}.off{background:#fdf3e3;color:#8a5a00}
.del{min-height:0;padding:4px 12px;background:none;border:1px solid #C8102E;color:#C8102E;font-size:13px;border-radius:0}.del:hover{background:#C8102E;color:#fff}
#msg{font-weight:700}#msg.err{color:#C8102E}#msg.ok{color:#0B6B3A}.hint{margin:0;color:#5b5f66;line-height:1.8}
@media (max-width:560px){main{padding:24px 12px}.card{padding:16px}th,td{font-size:14px;padding:8px 3px}}</style></head>
<body><div class="bar"></div><main><a href="/dashboard">← لوحة التحكم</a><h1 style="margin:0">الحسابات المسموحة</h1>
<div class="card">
<p class="hint">هذه الإيميلات فقط تستطيع الدخول إلى لوحة الدكتور، من أي جهاز. الحسابات محفوظة في قاعدة البيانات على الخادم وتبقى دائمًا.
بعد الإضافة، يفتح صاحب الإيميل صفحة الدخول ويضغط "تفعيل الحساب" فيصله رمز ويختار كلمة مروره.</p>
<form id="add"><input id="email" type="email" placeholder="example@gmail.com" aria-label="إيميل جديد" required><button>إضافة حساب</button></form>
<div id="msg" role="status"></div>
<div style="overflow-x:auto"><table><thead><tr><th>الإيميل</th><th>الحالة</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div></main><script src="/js/session.js"></script><script src="/js/accounts.js"></script></body></html>
