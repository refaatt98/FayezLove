services:
  - type: web
    name: smart-attendance
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DOCTOR_EMAIL
        value: abuhijleh@najah.edu
      - key: EXTRA_ALLOWED_EMAILS
        value: fayezghaith123@gmail.com
      - key: LATE_AFTER_MINUTES
        value: "0"
      - key: BASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
