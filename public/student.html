<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Cairo,sans-serif;background:#FAF8F3;color:#14161a}
.bar{height:8px;background:linear-gradient(90deg,#C8102E 0 10%,#14161a 10% 40%,#fff 40% 60%,#0B6B3A 60%)}
header{background:#14161a;color:#fff;text-align:center;padding:24px}header b{color:#9fd8b5}header h2{margin:4px 0;font-size:22px}
main{max-width:420px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;gap:18px}
label{font-weight:700;display:block;margin-bottom:8px}
input{width:100%;box-sizing:border-box;height:52px;padding:0 14px;border:1px solid #9a968c;border-radius:6px;font:16px Cairo}
button{height:56px;background:#0B6B3A;color:#fff;border:0;border-radius:6px;font:800 18px Cairo}
.card{background:#fff;border:1px solid #E3DFD6;padding:20px;text-align:right}.ok{color:#0B6B3A}.bad{color:#C8102E}
[hidden]{display:none}
</style></head><body><div class="bar"></div>
<header><b>جامعة النجاح الوطنية</b><h2>دراسات فلسطينية (خريف 2026)</h2><div>الدكتور سائد أبو حجلة</div></header>
<main>
<form id="f" style="display:flex;flex-direction:column;gap:18px"><h1 style="margin:0">تسجيل الحضور</h1>
<div><label for="n">الاسم الكامل</label><input id="n" autocomplete="name" required></div>
<div><label for="i">الرقم الجامعي</label><input id="i" inputmode="numeric" required></div>
<div id="err" class="bad" role="alert" style="font-weight:700"></div><button>تسجيل الحضور</button></form>
<div id="res" hidden class="card" style="text-align:center"></div>
</main><script src="/js/student.js"></script><footer style="text-align:center;padding:20px;color:#5b5f66;font:14px Cairo,sans-serif;border-top:1px solid #E3DFD6;background:#FAF8F3">تصميم: <a href="https://www.instagram.com/fayezghaith/" target="_blank" rel="noopener" style="color:#0B6B3A;font-weight:700;text-decoration:none">Fayez Ghaith</a> · <a href="https://www.instagram.com/fayezghaith/" target="_blank" rel="noopener" style="color:#0B6B3A;text-decoration:none">@fayezghaith</a></footer>
</body></html>
